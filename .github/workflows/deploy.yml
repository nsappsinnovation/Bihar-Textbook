name: Deploy Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Deploy to IIS
        shell: powershell
        run: |
          $source = "$env:GITHUB_WORKSPACE\dist"
          $destination = "C:\Users\bstbpcweb\Desktop\my-react-test\dist"

          if (!(Test-Path $source)) {
            throw "Build output folder not found: $source"
          }

          if (!(Test-Path $destination)) {
            throw "IIS destination folder not found: $destination"
          }

          robocopy $source $destination /E /XF web.config
          $robocopyExitCode = $LASTEXITCODE

          if ($robocopyExitCode -ge 8) {
            throw "Deployment failed with robocopy exit code $robocopyExitCode"
          }

          Write-Host "Frontend deployment completed successfully. Existing web.config preserved."

          exit 0