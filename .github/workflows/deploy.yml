name: Deploy Frontend to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    env:
      # TODO: set these to the real paths on the Windows server
      ENV_FILE: E:\Bihar-Textbook-Frontend\.env   # holds VITE_API_URL (not stored in Git)
      WEB_ROOT: E:\inetpub\wwwroot\bihar-textbook  # folder the web server (IIS/nginx) serves

    steps:

      # 1. Get latest code from master
      - name: Checkout production code
        uses: actions/checkout@v4

      # 2. Restore production-only .env (Vite bakes VITE_* values in at build time)
      - name: Restore production .env
        shell: powershell
        run: |
          Copy-Item "$env:ENV_FILE" ".\.env" -Force

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the static site into dist/
      - name: Build
        run: npm run build

      # 5. Publish dist/ to the folder the web server serves.
      #    No purge (/MIR) on purpose: gitignored content such as public/PDFs and
      #    public/images/classes may live on the server, and web.config must survive.
      - name: Deploy to web root
        shell: powershell
        run: |
          robocopy ".\dist" "$env:WEB_ROOT" /E /XF web.config

          # robocopy exit codes 0-7 mean success
          if ($LASTEXITCODE -gt 7) {
            exit $LASTEXITCODE
          }

          exit 0
